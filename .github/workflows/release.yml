name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # Actions tab -> "Build & Release" -> Run workflow

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate project
        run: |
          SETTINGS=$(find . -name 'settings.gradle.kts' -not -path '*/.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found in repository"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          VERSION=$(grep -oP 'val appVersionName\s*=\s*"\K[^"]+' "$DIR/app/build.gradle.kts" || true)
          VERSION=${VERSION:-0.0.0}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Project dir: $DIR  |  Version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.13

      - name: Prepare signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets missing -> building an installable DEBUG apk instead of a release apk."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore check failed. Verify KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS secrets."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "mode=release" >> "$GITHUB_OUTPUT"

      # Builds the app and, on failure, prints the REAL Gradle error as an
      # annotation + in the run summary page.
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; G=./gradlew; else G=gradle; fi
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            TASKS="assembleRelease bundleRelease"
          else
            TASKS="assembleDebug"
          fi
          LOG="$RUNNER_TEMP/build.log"

          set +e
          $G $TASKS --no-daemon --stacktrace --console=plain 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            WENT_WRONG=$(sed -n '/What went wrong/,/\* Try:/p' "$LOG" | head -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${WENT_WRONG}"
            KT=$(grep -E '^e: ' "$LOG" | head -10 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            if [ -n "$KT" ]; then
              echo "::error title=Kotlin compile errors::${KT}"
            fi
            {
              echo '### Gradle build failed - last 80 log lines'
              echo '```'
              tail -n 80 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find "$PROJECT_DIR/app/build/outputs" \( -name '*.apk' -o -name '*.aab' \) -exec cp {} dist/ \;
          ls -la dist
          if [ -z "$(ls -A dist)" ]; then echo "::error::No APK/AAB produced"; exit 1; fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BatteryTracker-v${{ env.VERSION }}
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: BatteryTracker v${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
